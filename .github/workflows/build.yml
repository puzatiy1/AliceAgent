name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.3/bin" >> $GITHUB_PATH

      - name: Generate wrapper
        run: gradle wrapper --gradle-version=8.3 && chmod +x gradlew

      - name: Build APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check APK exists
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk && echo "APK READY!" || (echo "APK NOT FOUND!" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliceAgent-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
