name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.3/bin" >> $GITHUB_PATH

      - name: Show project structure
        run: find . -not -path './.git/*' | sort | head -80

      - name: Generate wrapper
        run: gradle wrapper --gradle-version=8.3 && chmod +x gradlew

      - name: Build APK (with full output)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon --info 2>&1 | tail -100

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AliceAgent-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30
